<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Расписание занятий</title>
    <!-- Подключаем стили FullCalendar -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #calendar { max-width: 1100px; margin: 0 auto; height: 80vh; }
        .fc-event { cursor: pointer; }
    </style>
</head>
<body>

    <h1>Расписание занятий</h1>
    <div id='calendar'></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');

            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'ru', // Русский язык
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay,listMonth'
                },
                editable: true, // Разрешить перетаскивание
                droppable: true,
                events: '/api/lessons/', // Ссылка на наше API
                
                // Обработка клика по событию
                eventClick: function(info) {
                    alert('Занятие: ' + info.event.title + 
                          '\nПреподаватель: ' + info.event.extendedProps.teacher + 
                          '\nКабинет: ' + info.event.extendedProps.room);
                },

                // Обработка перетаскивания (Drag & Drop)
                eventDrop: function(info) {
                    // Здесь нужно будет отправить AJAX запрос на сервер для обновления времени
                    console.log("Событие перемещено:", info.event.id, info.event.start);
                    // Пример: updateLessonTime(info.event.id, info.event.start);
                    alert("Время занятия обновлено (требуется реализация backend части)");
                }
            });

            calendar.render();
        });
    </script>
</body>
</html>

{% extends "base.html" %}

{% block title %}Редактировать комментарий{% endblock %}

{% block page_title %}Редактировать комментарий{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto; background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08);">
  <h2>Редактировать комментарий</h2>
  <p><strong>Клиент:</strong> {{ client.last_name }} {{ client.first_name }}</p>

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <textarea name="content" class="form-control" rows="5">{{ interaction.content }}</textarea>
    </div>
    <button type="submit" class="btn btn-success">Сохранить</button>
    <a href="{% url 'client_detail' client.id %}" class="btn btn-secondary">Отмена</a>
  </form>
</div>
{% endblock %}
